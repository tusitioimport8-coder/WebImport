server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxy inverso hacia el backend en Railway para que la cookie sea same-origin
    location /api/ {
        proxy_pass https://webimport-production.up.railway.app;
        proxy_http_version 1.1;

        proxy_set_header Host webimport-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / /;
        proxy_ssl_server_name on;
    }

    # Configuración clave para Single Page Applications (SPA) con Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché eficiente para archivos estáticos (opcional pero recomendado)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
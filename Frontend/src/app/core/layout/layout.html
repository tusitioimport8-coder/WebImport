<tui-root>
  <header tuiNavigationHeader>
    <div tuiNavigationLogo>
      <tui-icon icon="@tui.box" style="font-size: 2rem; margin-right: 0.5rem;"></tui-icon>
      <strong>TuSitio Import</strong>
    </div>

    <button
      appearance="icon"
      tuiButton
      tuiNavigationDrawer
      iconStart="@tui.menu"
      [attr.data-drawer]="open"
      (click)="open = !open"
    ></button>
  </header>

  <nav tuiNavigationAside>
    <button
      appearance="icon"
      tuiButton
      iconStart="@tui.menu"
      (click)="handleToggle()"
    ></button>
    
    <hr />

    <button tuiNavigationItem (click)="navegar('/inicio', 0)">
      <tui-icon icon="@tui.home"></tui-icon>
      Inicio
    </button>
    
    <button tuiNavigationItem (click)="navegar('/catalogo', 1)">
      <tui-icon icon="@tui.layout-dashboard"></tui-icon>
      Catálogo
    </button>
  </nav>

  <main tuiNavigationMain>
    <div tuiSubheader>
      <tui-tabs [(activeItemIndex)]="activeItemIndex">
        <button tuiTab (click)="navegar('/inicio', 0)">Inicio</button>
        <button tuiTab (click)="navegar('/catalogo', 1)">Catálogo</button>
      </tui-tabs>
    </div>
    
    <div style="padding: 1.5rem;">
      <router-outlet></router-outlet>
    </div>
  </main>
</tui-root>

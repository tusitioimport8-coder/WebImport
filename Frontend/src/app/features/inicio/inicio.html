<div class="inicio-container">
  <h2 class="titulo-seccion">Para Ti</h2>

  <div class="carousel-wrapper">
    <button 
      tuiButton 
      appearance="flat" 
      type="button"
      class="nav-btn prev"
      (click)="prev()">
      <i class="pi pi-chevron-left"></i>
    </button>

    <div class="carousel-viewport">
      <div 
        class="carousel-track" 
        [style.transform]="'translateX(' + translateX() + '%)'"
        [class.transition-active]="isTransitioning()"
        (transitionend)="onTransitionEnd()">
        
        <div *ngFor="let product of products" class="carousel-slide">
          <div appearance="floating" tuiCardLarge class="tarjeta-item">
            <div class="imagen-wrapper">
              <img [src]="product.image" [alt]="product.name" class="imagen-producto" />
              <p-tag 
                [value]="product.status" 
                [severity]="getSeverity(product.status)" 
                class="tag-estado" 
              />
            </div>

            <div tuiHeader class="header-producto">
              <h3 tuiTitle class="nombre-producto">
                {{ product.name }}
                <span tuiSubtitle class="precio-producto">${{ product.price }}</span>
              </h3>
            </div>

            <button 
              tuiButton 
              appearance="primary" 
              type="button" 
              class="btn-comprar">
              Añadir al carrito
            </button>
          </div>
        </div>

      </div>
    </div>

    <button 
      tuiButton 
      appearance="flat" 
      type="button"
      class="nav-btn next"
      (click)="next()">
      <i class="pi pi-chevron-right"></i>
    </button>
  </div>
</div>
